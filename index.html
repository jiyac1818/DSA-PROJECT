<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Auth Demo — Login & Register</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <div class="card">
      <div class="brand">
        <!-- simple inline logo -->
        <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 12h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M12 8v8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <h1>MySite</h1>
      </div>

      <div class="toggle">
        <button id="to-login" class="toggle-btn active">Login</button>
        <button id="to-register" class="toggle-btn">Register</button>
      </div>

      <section id="forms">
        <!-- LOGIN -->
        <form id="login-form" class="form active" autocomplete="on">
          <h2>Login</h2>

          <label>
            <span class="label-row">
              <!-- user icon -->
              <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 20a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Email
            </span>
            <input id="login-email" name="email" type="email" required placeholder="you@example.com" />
          </label>

          <label>
            <span class="label-row">
              <!-- lock icon -->
              <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <rect x="3" y="11" width="18" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
                <path d="M7 11V8a5 5 0 0 1 10 0v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              Password
            </span>
            <input id="login-password" name="password" type="password" required placeholder="••••••••" />
          </label>

          <div class="form-actions">
            <button type="submit" class="btn primary">Login</button>
            <button type="button" id="login-demo" class="btn ghost">Demo</button>
          </div>

          <div id="login-message" class="message" aria-live="polite"></div>
        </form>

        <!-- REGISTER -->
        <form id="register-form" class="form" autocomplete="on">
          <h2>Create account</h2>

          <label>
            <span class="label-row">
              <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 20a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.5"/>
              </svg>
              Full name
            </span>
            <input id="reg-name" name="name" type="text" required placeholder="Your name" />
          </label>

          <label>
            <span class="label-row">
              <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M12 12h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M12 8v8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              Email
            </span>
            <input id="reg-email" name="email" type="email" required placeholder="you@example.com" />
          </label>

          <label>
            <span class="label-row">
              <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <rect x="3" y="11" width="18" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
                <path d="M7 11V8a5 5 0 0 1 10 0v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              Password
            </span>
            <input id="reg-password" name="password" type="password" required placeholder="At least 6 characters" minlength="6" />
          </label>

          <div class="form-actions">
            <button type="submit" class="btn primary">Register</button>
            <button type="button" id="fill-sample" class="btn ghost">Fill sample</button>
          </div>

          <div id="register-message" class="message" aria-live="polite"></div>
        </form>
      </section>

      <footer class="note">
        This demo expects a backend at <code>http://localhost:8080</code>. Backend must accept JSON POST to <code>/login</code> and <code>/register</code>.
      </footer>
    </div>
  </main>

<script>
/* ===========================
   FRONTEND JS — Form handling
   =========================== */

const BASE_URL = "http://localhost:8080"; // change if your C backend runs on another port

// UI elements
const toLoginBtn = document.getElementById('to-login');
const toRegisterBtn = document.getElementById('to-register');
const loginForm = document.getElementById('login-form');
const registerForm = document.getElementById('register-form');
const loginMessage = document.getElementById('login-message');
const registerMessage = document.getElementById('register-message');

function showForm(formName) {
  document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));

  if (formName === 'login') {
    toLoginBtn.classList.add('active');
    loginForm.classList.add('active');
  } else {
    toRegisterBtn.classList.add('active');
    registerForm.classList.add('active');
  }
}

toLoginBtn.addEventListener('click', () => showForm('login'));
toRegisterBtn.addEventListener('click', () => showForm('register'));

// Helper to show messages
function setMessage(container, text, type = 'info') {
  container.textContent = text;
  container.className = 'message ' + type;
}

// Simple fetch wrapper that returns JSON and handles network errors
async function postJson(path, data) {
  const url = BASE_URL + path;
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    // Try parse JSON body (backend should return JSON)
    const text = await res.text();
    let json = null;
    try { json = text ? JSON.parse(text) : null; } catch(e){ json = { raw: text }; }
    return { ok: res.ok, status: res.status, body: json };
  } catch (err) {
    return { ok: false, error: err.message || String(err) };
  }
}

/* ------- Login submit ------- */
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  setMessage(loginMessage, 'Connecting...', 'info');

  const payload = {
    email: document.getElementById('login-email').value.trim(),
    password: document.getElementById('login-password').value
  };

  const result = await postJson('/login', payload);

  if (!result.ok) {
    setMessage(loginMessage, result.error || `Network error (status ${result.status})`, 'error');
    return;
  }

  // backend returned ok status
  // expected payload: { success: true, message: "...", token?: "..." }
  const body = result.body || {};
  if (body.success) {
    setMessage(loginMessage, body.message || 'Login successful!', 'success');
    // store token if provided
    if (body.token) localStorage.setItem('authToken', body.token);
    // redirect or show dashboard — here we simply show success and clear form
    loginForm.reset();
    // You can redirect: window.location.href = '/dashboard.html';
  } else {
    setMessage(loginMessage, body.message || `Login failed (status ${result.status})`, 'error');
  }
});

/* ------- Register submit ------- */
registerForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  setMessage(registerMessage, 'Connecting...', 'info');

  const payload = {
    name: document.getElementById('reg-name').value.trim(),
    email: document.getElementById('reg-email').value.trim(),
    password: document.getElementById('reg-password').value
  };

  const result = await postJson('/register', payload);

  if (!result.ok) {
    setMessage(registerMessage, result.error || `Network error (status ${result.status})`, 'error');
    return;
  }

  const body = result.body || {};
  if (body.success) {
    setMessage(registerMessage, body.message || 'Registered successfully! You can login now.', 'success');
    registerForm.reset();
    // switch to login automatically
    showForm('login');
  } else {
    setMessage(registerMessage, body.message || `Register failed (status ${result.status})`, 'error');
  }
});

/* ------- small helpers for demo buttons ------- */
document.getElementById('login-demo').addEventListener('click', () => {
  document.getElementById('login-email').value = 'demo@example.com';
  document.getElementById('login-password').value = 'demo123';
});

document.getElementById('fill-sample').addEventListener('click', () => {
  document.getElementById('reg-name').value = 'Disha Jha';
  document.getElementById('reg-email').value = 'disha@example.com';
  document.getElementById('reg-password').value = 'password123';
});

/* Accessibility: press Enter on toggle keys also toggles forms */
toLoginBtn.addEventListener('keydown', (e) => { if (e.key === 'Enter') showForm('login'); });
toRegisterBtn.addEventListener('keydown', (e) => { if (e.key === 'Enter') showForm('register'); });

/* By default show login */
showForm('login');

</script>
</body>
</html>
